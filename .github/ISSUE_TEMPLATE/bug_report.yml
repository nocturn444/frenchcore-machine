name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Load the plugin in ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options: [VST3, AU, Standalone]
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: DAW and version
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Preset, project or audio that shows the problem

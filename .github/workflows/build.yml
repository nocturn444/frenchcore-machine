# SPDX-License-Identifier: AGPL-3.0-only
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository. Pull requests from forks get a read-only token anyway.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  # The SHA-256 of each pluginval zip is in the matrix below; update both together.
  PLUGINVAL_VERSION: v1.0.4

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check clang-format
        run: |
          files=$(git ls-files 'src/*.h' 'src/*.cpp' 'tests/*.h' 'tests/*.cpp')
          clang-format --version
          clang-format --dry-run --Werror $files

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            pluginval-sha256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
            pluginval-bin: ./pluginval
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            pluginval-sha256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
            pluginval-bin: ./pluginval.app/Contents/MacOS/pluginval
            extra-cmake-args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13'
          - name: Windows
            os: windows-2025
            pluginval: pluginval_Windows.zip
            pluginval-sha256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
            pluginval-bin: ./pluginval.exe
            extra-cmake-args: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb zip \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Own setup instead of a third-party action: find Visual Studio with vswhere, run vcvarsall.bat
      # for x64 and export the resulting environment to the following steps.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $root = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw 'Visual Studio with the C++ x64 tools was not found' }
          $vcvars = Join-Path $root 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x64 > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" }
          }

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} ${{ matrix.extra-cmake-args }}

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: pluginval (VST3)
        shell: bash
        env:
          PLUGINVAL_SHA256: ${{ matrix.pluginval-sha256 }}
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          # Verify the download before it is extracted or run.
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "${PLUGINVAL_SHA256}  pluginval.zip" | shasum -a 256 -c -
          else
            echo "${PLUGINVAL_SHA256}  pluginval.zip" | sha256sum -c -
          fi
          unzip -q pluginval.zip
          plugin="build/src/plugin/FrenchcoreMachine_artefacts/${BUILD_TYPE}/VST3/Frenchcore Machine.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ${{ matrix.pluginval-bin }} --strictness-level 10 --skip-gui-tests --validate "$plugin"
          else
            ${{ matrix.pluginval-bin }} --strictness-level 10 --skip-gui-tests --validate "$plugin"
          fi

      # Apple's own validator for the AU, which pluginval above does not cover. The codes are the
      # ones in src/plugin/CMakeLists.txt: type aumu (instrument), PLUGIN_CODE, PLUGIN_MANUFACTURER_CODE.
      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/src/plugin/FrenchcoreMachine_artefacts/${BUILD_TYPE}/AU/Frenchcore Machine.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -q "aumu Fcmk Nctr" || { auval -a; echo "The AU is not registered"; exit 1; }
          auval -v aumu Fcmk Nctr

      # The same packaging as the release workflow, so a broken zip shows up here and not on release day.
      - name: Package (release dry run)
        shell: bash
        run: |
          packaging/package.sh "${BUILD_TYPE}" 0.0.0 package-check.zip
          if [ "$RUNNER_OS" = "Windows" ]; then 7z l package-check.zip; else unzip -l package-check.zip; fi > package-list.txt
          cat package-list.txt
          for required in LICENSE.txt README.txt VST3 Standalone; do
            grep -q "${required}" package-list.txt || { echo "${required} is missing from the zip"; exit 1; }
          done
          if grep -Eq "\.(lib|exp|pdb)$" package-list.txt; then echo "Build leftovers in the zip"; exit 1; fi

      - name: Upload plugins
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FrenchcoreMachine-${{ matrix.name }}
          path: |
            build/src/plugin/FrenchcoreMachine_artefacts/${{ env.BUILD_TYPE }}/VST3
            build/src/plugin/FrenchcoreMachine_artefacts/${{ env.BUILD_TYPE }}/AU
            build/src/plugin/FrenchcoreMachine_artefacts/${{ env.BUILD_TYPE }}/Standalone
          if-no-files-found: error
